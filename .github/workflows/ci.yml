name: PREDICTA AI validation
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            experimental: false
          - python: '3.12'
            experimental: false
          - python: '3.13'
            experimental: false
          - python: '3.14'
            experimental: false
          - python: '3.15'
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test analytical core
        run: python -m pytest -q
      - name: Notebook validation (JSON, Python cells)
        run: python -m scripts.validate_notebook
      - name: Native Python 3.15 lazy-import demonstration
        if: matrix.python == '3.15'
        run: python experiments/python315_explicit_lazy.py
