name: Train NASA model release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'nbclient>=0.10,<1' 'ipykernel>=6.29,<8'
      - name: Source validation
        run: |
          python -m pytest -q
          python -m scripts.validate_notebook
          python -m scripts.deployment_check
      - name: Train and evaluate real NASA FD001
        run: python -m scripts.train_release
      - name: Check trained model and serving parity
        run: |
          python -m scripts.preflight
          python -m scripts.deployment_check --strict
      - name: Upload trusted model release for review
        uses: actions/upload-artifact@v4
        with:
          name: predicta-model-release
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/*.joblib
            artifacts/*.csv
            artifacts/*.json
            data/sample/*.csv
