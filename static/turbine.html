<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turbofan schematic</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;color:#17292D;background:#F4F2EA;font-family:Arial,sans-serif;color-scheme:light}.scene{position:relative;height:312px;overflow:hidden;background:radial-gradient(ellipse at 51% 65%,#DDE3DA 0,transparent 47%),#EEEFE7;border-radius:3px}.scene:after{content:'';position:absolute;left:18%;right:18%;bottom:46px;height:25px;border-radius:50%;background:#75827B22;filter:blur(13px);pointer-events:none}canvas{display:block;width:100%;height:268px;touch-action:pan-y;cursor:grab;position:relative;z-index:1}canvas:active{cursor:grabbing}.label{position:absolute;left:18px;top:16px;font-size:11px;color:#546966;z-index:2}.controls{position:absolute;bottom:12px;right:12px;display:flex;gap:6px;z-index:3}button{background:#FDFCF8;color:#17292D;border:1px solid #CFD5C9;border-radius:3px;padding:0 11px;min-height:36px;font-size:11px;cursor:pointer;touch-action:manipulation;transition:background-color .16s,color .16s}button[aria-pressed=true]{background:#234FCC;color:white;border-color:#234FCC}button:hover{border-color:#234FCC}button:focus-visible,canvas:focus-visible{outline:3px solid #234FCC;outline-offset:-3px}button:disabled{opacity:.45;cursor:default}.foot{position:absolute;left:18px;bottom:22px;font-size:10px;color:#546966;z-index:2}.fallback{position:absolute;inset:35px 8% 55px;width:84%;height:220px;display:none}.fallback.visible{display:block}.sr{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}@media(max-width:420px){.foot{bottom:57px}.label{left:12px}.controls{left:12px;right:auto}button{min-height:40px}.scene:after{bottom:64px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<section class="scene" aria-label="Interactive turbine illustration"><span class="label">Turbofan schematic</span><canvas id="engine" tabindex="0" role="img" aria-label="Illustrated cutaway turbofan. Use arrow keys or the controls to change the view." aria-describedby="description"></canvas>
<svg class="fallback" viewBox="0 0 640 250" role="img" aria-label="Static cutaway turbine illustration"><defs><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#BDC9C5"/><stop offset=".5" stop-color="#FDFCF8"/><stop offset="1" stop-color="#81958F"/></linearGradient></defs><path d="M110 70 Q285 12 480 87 L525 163 Q288 219 110 167Z" fill="url(#metal)" stroke="#546966"/><ellipse cx="116" cy="119" rx="43" ry="79" fill="#234FCC" stroke="#17292D" stroke-width="3"/><ellipse cx="116" cy="119" rx="14" ry="27" fill="#FDFCF8"/><path d="M163 83L500 115L496 143L163 157Z" fill="#D9E0D5"/><g fill="none" stroke="#234FCC" stroke-width="8"><path d="M235 72L230 170M290 79L285 167M345 87L340 164M400 95L395 159"/></g></svg>
<span class="foot">Illustration · not telemetry</span><div class="controls" aria-label="3D controls"><button id="left" aria-label="Turn turbine left">←</button><button id="right" aria-label="Turn turbine right">→</button><button id="rotate" aria-pressed="false">Rotate</button><button id="explode" aria-pressed="false">Explode</button></div><span id="description" class="sr">Schematic geometry does not represent an actual engine or its health. Rotation is visual only.</span><span id="status" class="sr" role="status" aria-live="polite"></span></section>
<script>
(() => {
 'use strict';
 const canvas=document.getElementById('engine'),container=document.querySelector('.scene'),fallback=document.querySelector('.fallback'),rotate=document.getElementById('rotate'),explode=document.getElementById('explode'),status=document.getElementById('status'),motion=matchMedia('(prefers-reduced-motion: reduce)');
 let gl,program,buffer,raf=0,observer,visible=true,disposed=false,rotating=false,yaw=-.52,pitch=-.24,spin=0,spread=0,targetSpread=0,last=0,introStart=0,frames=0,drag=null;
 const verts=[],blue=[.14,.31,.80],steel=[.60,.69,.67],light=[.80,.85,.81],dark=[.28,.38,.38];
 function tri(a,b,c,color,rotor=0,stage=0){const u=b.map((v,i)=>v-a[i]),v=c.map((v,i)=>v-a[i]);let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];const l=Math.hypot(...n)||1;n=n.map(v=>v/l);for(const p of [a,b,c])verts.push(...p,...n,...color,rotor,stage);}
 function lathe(x0,x1,r0,r1,color,stage=0,start=0,end=Math.PI*2){for(let i=0;i<64;i++){const a=start+(end-start)*i/64,b=start+(end-start)*(i+1)/64;const p=(x,r,t)=>[x,r*Math.cos(t),r*Math.sin(t)];const A=p(x0,r0,a),B=p(x1,r1,a),C=p(x1,r1,b),D=p(x0,r0,b);tri(A,B,C,color,0,stage);tri(A,C,D,color,0,stage);}}
 function ring(x,r,t,color,stage=0){for(let j=0;j<8;j++){const a=j*Math.PI/4,b=(j+1)*Math.PI/4;lathe(x+Math.cos(a)*t,x+Math.cos(b)*t,r+Math.sin(a)*t,r+Math.sin(b)*t,color,stage);}}
 function blades(x,r,n,color,stage=0){for(let i=0;i<n;i++){const a=i*Math.PI*2/n;const p=(radius,theta,depth)=>[x+depth,radius*Math.cos(theta),radius*Math.sin(theta)];const A=p(.28,a,0),B=p(r,a+.14,.13),C=p(r,a+.34,.02),D=p(.28,a+.28,-.06);tri(A,B,C,color,1,stage);tri(A,C,D,color,1,stage);tri(C,B,A,color,1,stage);tri(D,C,A,color,1,stage);}}
 // Procedural illustration only. None of these dimensions is an equipment observation.
 lathe(-2,1.8,.16,.12,dark);lathe(-2.12,-1.7,0,.30,light);blades(-1.68,1.12,22,blue,-1);ring(-1.78,1.2,.09,steel,-1);ring(-1.50,1.17,.04,light,-1);
 for(let i=0;i<6;i++){const x=-.92+i*.38,r=.72-i*.046;blades(x,r,16, i%2?steel:blue,i*.16);ring(x,r+.045,.045,light,i*.16);lathe(x-.12,x+.14,.28,.28,dark,i*.16);}
 // Open casing exposes the compressor rather than suggesting a diagnostic surface.
 lathe(-1.42,1.44,1.16,.72,light,.8,Math.PI*1.05,Math.PI*1.95);ring(1.5,.73,.07,steel,.9);lathe(1.5,2.10,.65,.36,steel,1);lathe(1.52,2.14,.43,.27,dark,1);
 const vertex=`attribute vec3 aPosition;attribute vec3 aNormal;attribute vec3 aColor;attribute float aRotor;attribute float aStage;uniform float uYaw;uniform float uPitch;uniform float uSpin;uniform float uSpread;uniform float uAspect;uniform float uScale;varying vec3 vNormal;varying vec3 vColor;
 vec3 rx(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(p.x,c*p.y-s*p.z,s*p.y+c*p.z);}vec3 ry(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z);}void main(){vec3 p=rx(aPosition,uSpin*aRotor);p.x+=aStage*uSpread*.85;p=rx(ry(p,uYaw),uPitch);p.z-=5.6;vNormal=rx(ry(rx(aNormal,uSpin*aRotor),uYaw),uPitch);vColor=aColor;gl_Position=vec4(p.x*uScale/uAspect,p.y*uScale,-1.002*p.z-.2002,-p.z);}`;
 const fragment=`precision mediump float;varying vec3 vNormal;varying vec3 vColor;void main(){vec3 n=normalize(vNormal);float d=max(dot(n,normalize(vec3(-.3,.7,1.))),0.0);float rim=pow(1.0-abs(n.z),2.0);vec3 c=vColor*(.50+.50*d)+vec3(.08)*rim;gl_FragColor=vec4(c,1.);}`;
 function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
 let locations={};
 function init(){gl=canvas.getContext('webgl',{alpha:true,antialias:true,powerPreference:'low-power'});if(!gl)throw Error('WebGL unavailable');const vs=shader(gl.VERTEX_SHADER,vertex),fs=shader(gl.FRAGMENT_SHADER,fragment);program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);gl.deleteShader(vs);gl.deleteShader(fs);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error('Shader link failed');gl.useProgram(program);buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(verts),gl.STATIC_DRAW);for(const [name,size,offset]of [['aPosition',3,0],['aNormal',3,3],['aColor',3,6],['aRotor',1,9],['aStage',1,10]]){const loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,44,offset*4);}for(const name of ['uYaw','uPitch','uSpin','uSpread','uAspect','uScale'])locations[name]=gl.getUniformLocation(program,name);gl.enable(gl.DEPTH_TEST);fallback.classList.remove('visible');canvas.style.visibility='visible';container.dataset.renderer='webgl';document.querySelectorAll('button').forEach(b=>b.disabled=false);rotate.disabled=motion.matches;resize();}
 function staticFallback(message){cancelAnimationFrame(raf);raf=0;rotating=false;container.dataset.renderer='fallback';container.dataset.animation='paused';canvas.style.visibility='hidden';fallback.classList.add('visible');document.querySelectorAll('button').forEach(b=>b.disabled=true);status.textContent=message;}
 function resize(){if(!gl||gl.isContextLost())return;const dpr=Math.min(devicePixelRatio||1,1.5),w=Math.max(1,canvas.clientWidth),h=268;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);gl.viewport(0,0,canvas.width,canvas.height);draw();}
 function draw(){if(!gl||gl.isContextLost()||disposed)return;gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(program);gl.uniform1f(locations.uYaw,yaw);gl.uniform1f(locations.uPitch,pitch);gl.uniform1f(locations.uSpin,spin);gl.uniform1f(locations.uSpread,spread);gl.uniform1f(locations.uAspect,canvas.width/canvas.height);gl.uniform1f(locations.uScale,Math.min(3.1,canvas.width/canvas.height*1.55));gl.drawArrays(gl.TRIANGLES,0,verts.length/11);container.dataset.frames=String(++frames);container.dataset.spread=spread.toFixed(3);container.dataset.yaw=yaw.toFixed(3);}
 function schedule(){if(!raf&&!disposed&&visible&&!document.hidden&&container.dataset.renderer==='webgl')raf=requestAnimationFrame(tick);}
 function tick(t){raf=0;const dt=Math.min((t-(last||t))/1000,.05);last=t;let moving=false;if(rotating&&!motion.matches){spin+=dt*.8;moving=true;}if(Math.abs(spread-targetSpread)>.001){spread+=(targetSpread-spread)*Math.min(1,dt*9);moving=true;}else spread=targetSpread;if(introStart&&!motion.matches){const elapsed=t-introStart;if(elapsed<1200){spin=elapsed/1200*.35;moving=true;}else introStart=0;}draw();container.dataset.animation=moving?'running':'paused';if(moving)schedule();else last=0;}
 function toggleRotation(){rotating=!rotating;introStart=0;rotate.textContent=rotating?'Pause':'Rotate';rotate.setAttribute('aria-pressed',String(rotating));container.dataset.animation=rotating?'running':'paused';if(rotating)schedule();else{cancelAnimationFrame(raf);raf=0;last=0;draw();if(Math.abs(spread-targetSpread)>.001)schedule();}}
 rotate.addEventListener('click',toggleRotation);explode.addEventListener('click',()=>{targetSpread=targetSpread?0:1;explode.setAttribute('aria-pressed',String(Boolean(targetSpread)));explode.textContent=targetSpread?'Assemble':'Explode';status.textContent=targetSpread?'Exploded schematic view':'Assembled schematic view';if(motion.matches){spread=targetSpread;draw();}else schedule();});
 function turn(delta){yaw+=delta;introStart=0;draw();}document.getElementById('left').addEventListener('click',()=>turn(-.22));document.getElementById('right').addEventListener('click',()=>turn(.22));canvas.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();turn(e.key==='ArrowLeft'?-.22:.22);}});
 canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag.x)*.007;pitch=Math.max(-.8,Math.min(.6,pitch+(e.clientY-drag.y)*.005));drag={x:e.clientX,y:e.clientY};introStart=0;draw();});for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>drag=null);
 motion.addEventListener('change',()=>{if(motion.matches){rotating=false;introStart=0;cancelAnimationFrame(raf);raf=0;spread=targetSpread;rotate.textContent='Rotate';rotate.setAttribute('aria-pressed','false');container.dataset.animation='paused';draw();}rotate.disabled=motion.matches||container.dataset.renderer!=='webgl';});
 document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;last=0;}else if(rotating||Math.abs(spread-targetSpread)>.001)schedule();});
 canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();staticFallback('3D unavailable. Static schematic shown.');});canvas.addEventListener('webglcontextrestored',()=>{try{init();status.textContent='3D view restored';}catch(e){staticFallback('Static schematic shown.');}});
 try{init();observer=new ResizeObserver(resize);observer.observe(canvas);const intersection=new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;if(!visible){cancelAnimationFrame(raf);raf=0;last=0;}else if(rotating||Math.abs(spread-targetSpread)>.001)schedule();});intersection.observe(canvas);if(!motion.matches){introStart=performance.now();schedule();}else container.dataset.animation='paused';window.addEventListener('pagehide',()=>{disposed=true;cancelAnimationFrame(raf);observer.disconnect();intersection.disconnect();if(gl&&!gl.isContextLost()){gl.deleteBuffer(buffer);gl.deleteProgram(program);}});}catch(e){staticFallback('3D unavailable. Static schematic shown.');}
})();
</script></body></html>
